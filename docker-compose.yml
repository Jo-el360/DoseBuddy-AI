version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dosebuddy_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=DoseBuddy AI Backend
      - API_V1_STR=/api/v1
      - PORT=8000
      - HOST=0.0.0.0
      - USE_MOCK_SERVICES=true
    restart: always
